<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ejercicio Formulario</title>
    <style>
      form {
        display: block;
        margin-top: 0em;
      }
    </style>
  </head>
  <body>
    <!--Cree un Formulario con los campos que se proponen a continuacion-->
    <!--Agregue el atributo legend-->

    <!--Si tienes dudas de como hacer un formulario, puedes consultar:
    https://www.w3schools.com/html/tryit.asp?filename=tryhtml_elem_output-->

    <h3>
      Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!
    </h3>
    <form>
      <label for="nombre">Nombre:</label>
      <input type="text" name="nombre" placeholder="Nombre" /><br />
      <label for="apellido">Apellido:</label>
      <input type="text" name="apellido" placeholder="Apellido" /><br />
      <label for="sexo">Sexo:</label>
      <input type="radio" name="sexo" value="masculino" />
      <input type="radio" name="sexo" value="femenino" /><br />
      <label for="edad">Edad:</label>
      <input type="number" name="edad" placeholder="Edad" /><br />
      <label for="email">Email:</label>
      <input type="email" name="email" placeholder="Email" /><br />
      <label for="usuario">Usuario:</label>
      <input type="text" name="usuario" placeholder="Usuario" /><br />
      <label for="password">Password:</label>
      <input type="password" name="password" placeholder="Password" /><br />
      <label for="confirmar_password">Confirmar Password:</label>
      <input
        type="password"
        name="confirmar_password"
        placeholder="Confirmar Password"
      /><br />
      <label for="tipo_servicio">Tipo de servicio:</label>
      <select name="tipo_servicio" id="tipo_servicio">
        <option value="free">Free</option>
        <option value="standars">Standard</option>
        <option value="premium">Premium</option></select
      ><br />
      <label for="tema">Tema:</label>
      <input type="checkbox" name="tema" value="politica" />
      <input type="checkbox" name="tema" value="negocios" />
      <input type="checkbox" name="tema" value="tecnologia" />
      <input type="checkbox" name="tema" value="salud" />
      <br />
      <label for="comentario">Agregue un comentario:</label>
      <textarea
        name="comentario"
        id="comentario"
        placeholder="Agregue un comentario"
      ></textarea
      ><br />
      <button name="enviar" type="submit">Enviar</button>
    </form>
  </body>
</html>
